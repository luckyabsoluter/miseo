name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install miseo
        run: cargo install --path .

      - name: Add shims to PATH
        run: echo "$HOME/.miseo/.bin" >> "$GITHUB_PATH"

      - name: Verify mise is available
        run: mise --version

      - name: Configure global Node runtime (mise)
        run: mise use -g node@lts

      - name: Install prettier with miseo
        run: |
          miseo install npm:prettier@3.8.1
          test -L "$HOME/.miseo/.bin/prettier"

      - name: Prettier formats a file via miseo shim
        shell: bash
        run: |
          printf 'const x={a:1}\n' > smoke.js
          prettier --write smoke.js >/dev/null
          diff -u <(printf 'const x = { a: 1 };\n') smoke.js

      - name: Reinstall same version reports already-current
        run: miseo install npm:prettier@3.8.1

      - name: Force reinstall same pinned variant
        run: |
          miseo install npm:prettier@3.8.1 --force
          prettier --check smoke.js >/dev/null

      - name: Uninstall prettier
        run: |
          miseo uninstall npm:prettier
          test ! -e "$HOME/.miseo/.bin/prettier"
          test ! -d "$HOME/.miseo/npm-prettier"

      - name: Install prettier globally with miseo
        shell: bash
        run: miseo install -g npm:prettier@3.8.1

      - name: Verify global prettier npm install
        shell: bash
        run: |
          set -o pipefail
          case "$(readlink "$HOME/.miseo/npm-prettier/current")" in
            global+node-*) ;;
            *) exit 1 ;;
          esac

          global_version="$(
            mise exec --cd "$HOME/.miseo/npm-prettier/current" -- npm list -g prettier --json --depth=0 |
              node -e "let data = ''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => { const version = JSON.parse(data).dependencies?.prettier?.version; if (!version) process.exit(1); process.stdout.write(version); });"
          )"
          test "$global_version" = "3.8.1"

          global_prefix="$(mise exec --cd "$HOME/.miseo/npm-prettier/current" -- npm prefix -g)"
          test -x "$global_prefix/bin/prettier"

      - name: Global prettier formats a file via miseo shim
        shell: bash
        run: |
          test -L "$HOME/.miseo/.bin/prettier"
          printf 'const y={b:2}\n' > global-smoke.js
          prettier --write global-smoke.js >/dev/null
          diff -u <(printf 'const y = { b: 2 };\n') global-smoke.js

      - name: Uninstall global prettier
        run: |
          miseo uninstall npm:prettier
          test ! -e "$HOME/.miseo/.bin/prettier"
          test ! -d "$HOME/.miseo/npm-prettier"

  windows-smoke-test:
    name: Windows Smoke Test
    runs-on: windows-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install mise
        uses: jdx/mise-action@v3
        with:
          install: false

      - name: Install miseo
        run: cargo install --path .

      - name: Add shims to PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.miseo\.bin"

      - name: Verify mise is available
        run: mise --version

      - name: Configure global Node runtime (mise)
        run: mise use -g node@24

      - name: Install prettier with miseo
        shell: pwsh
        run: |
          miseo install npm:prettier@3.8.1
          if (!(Test-Path "$env:USERPROFILE\.miseo\.bin\prettier")) { throw "prettier shim missing" }
          if (!(Test-Path "$env:USERPROFILE\.miseo\.bin\prettier.cmd")) { throw "prettier.cmd shim missing" }
          if (!(Test-Path "$env:USERPROFILE\.miseo\.bin\prettier.ps1")) { throw "prettier.ps1 shim missing" }

      - name: Prettier formats a file via Windows shim
        shell: pwsh
        run: |
          Set-Content -Path smoke.js -Value 'const x={a:1}'
          prettier.cmd --write smoke.js
          $actual = (Get-Content -Raw smoke.js).Replace("`r`n", "`n")
          if ($actual -ne "const x = { a: 1 };`n") {
            throw "unexpected prettier output: $actual"
          }

      - name: Force reinstall same pinned variant
        run: |
          miseo install npm:prettier@3.8.1 --force
          prettier.cmd --check smoke.js

      - name: Uninstall prettier
        shell: pwsh
        run: |
          miseo uninstall npm:prettier
          if (Test-Path "$env:USERPROFILE\.miseo\.bin\prettier") { throw "prettier shim remains" }
          if (Test-Path "$env:USERPROFILE\.miseo\.bin\prettier.cmd") { throw "prettier.cmd shim remains" }
          if (Test-Path "$env:USERPROFILE\.miseo\.bin\prettier.ps1") { throw "prettier.ps1 shim remains" }
          if (Test-Path "$env:USERPROFILE\.miseo\npm-prettier") { throw "prettier install dir remains" }

      - name: Install prettier globally with miseo
        shell: pwsh
        run: miseo install -g npm:prettier@3.8.1

      - name: Verify global prettier npm install
        shell: pwsh
        run: |
          $globalVariants = @(Get-ChildItem -Path "$env:USERPROFILE\.miseo\npm-prettier" -Directory |
            Where-Object { $_.Name -like "global+node-*" }
          )
          if ($globalVariants.Count -ne 1) { throw "expected one global variant dir, found $($globalVariants.Count)" }
          $globalVariant = $globalVariants[0]

          $globalJson = mise exec --cd $globalVariant.FullName -- npm list -g prettier --json --depth=0
          if ($LASTEXITCODE -ne 0) { throw "npm list -g prettier failed" }
          $globalVersion = ($globalJson | ConvertFrom-Json).dependencies.prettier.version
          if ($globalVersion -ne "3.8.1") { throw "unexpected global prettier version: $globalVersion" }

          $globalPrefix = mise exec --cd $globalVariant.FullName -- npm prefix -g
          if ($LASTEXITCODE -ne 0) { throw "npm prefix -g failed" }
          if (!(Test-Path (Join-Path $globalPrefix "prettier.cmd"))) { throw "global prettier.cmd missing" }

      - name: Global prettier formats a file via Windows shim
        shell: pwsh
        run: |
          if (!(Test-Path "$env:USERPROFILE\.miseo\.bin\prettier")) { throw "prettier shim missing" }
          if (!(Test-Path "$env:USERPROFILE\.miseo\.bin\prettier.cmd")) { throw "prettier.cmd shim missing" }
          if (!(Test-Path "$env:USERPROFILE\.miseo\.bin\prettier.ps1")) { throw "prettier.ps1 shim missing" }

          Set-Content -Path global-smoke.js -Value 'const y={b:2}'
          prettier.cmd --write global-smoke.js
          $actual = (Get-Content -Raw global-smoke.js).Replace("`r`n", "`n")
          if ($actual -ne "const y = { b: 2 };`n") {
            throw "unexpected global prettier output: $actual"
          }

      - name: Uninstall global prettier
        shell: pwsh
        run: |
          miseo uninstall npm:prettier
          if (Test-Path "$env:USERPROFILE\.miseo\.bin\prettier") { throw "prettier shim remains" }
          if (Test-Path "$env:USERPROFILE\.miseo\.bin\prettier.cmd") { throw "prettier.cmd shim remains" }
          if (Test-Path "$env:USERPROFILE\.miseo\.bin\prettier.ps1") { throw "prettier.ps1 shim remains" }
          if (Test-Path "$env:USERPROFILE\.miseo\npm-prettier") { throw "prettier install dir remains" }

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [checks, smoke-test, windows-smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Windows cross linker
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Validate tag matches Cargo.toml version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(sed -n 's/^version = \"\(.*\)\"$/\1/p' Cargo.toml | head -n1)"
          test -n "$VERSION"
          test "$TAG" = "$VERSION"

      - name: Authenticate crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Build Linux release binary
        run: cargo build --release --locked

      - name: Build Windows release binary
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Package crate
        run: cargo package --locked

      - name: Prepare release artifacts
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = \"\(.*\)\"$/\1/p' Cargo.toml | head -n1)"

          TARGET="x86_64-unknown-linux-gnu"
          LINUX_BASENAME="miseo-v${VERSION}-${TARGET}"

          TARGET="x86_64-pc-windows-gnu"
          WINDOWS_BASENAME="miseo-v${VERSION}-${TARGET}"

          mkdir -p dist
          cp "target/release/miseo" "dist/${LINUX_BASENAME}"
          tar -C dist -czf "dist/${LINUX_BASENAME}.tar.gz" "${LINUX_BASENAME}"
          cp "target/x86_64-pc-windows-gnu/release/miseo.exe" "dist/${WINDOWS_BASENAME}.exe"
          tar -C dist -czf "dist/${WINDOWS_BASENAME}.tar.gz" "${WINDOWS_BASENAME}.exe"
          cp "target/package/miseo-${VERSION}.crate" "dist/"

          (
            cd dist
            sha256sum * > SHA256SUMS
          )

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
